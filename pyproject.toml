[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rci"
version = "0.1.0"
description = "Recursive collective intelligence: an equal-budget ladder for multi-agent LLM systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "openai>=1.40",
    "aiohttp>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
serve = ["vllm==0.32.0"]
train = [
    "torch==2.13.0",
    "transformers==5.20.2",
    "accelerate>=1.0",
    "flash-linear-attention==0.5.2",
    "safetensors>=0.4",
]
bench = [
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "pyarrow>=15.0",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
log = ["wandb>=0.17", "matplotlib>=3.8"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rci*"]

[tool.setuptools.package-data]
"rci.tasks.docsweep" = ["templates/*.json"]
"rci.tasks.fate.lean_service" = ["lean/*.lean"]
"rci.chains.planbench" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
